# 放到 %LOCALAPPDATA%\ModTheSpire\CommunicationMod\config.properties
#
# command 指向决策驱动（CommunicationMod 启动的外部进程）。
# 注意：Windows 路径里的反斜杠要写成两个，盘符冒号前要加一个反斜杠。
#
# 把下面两个 <...> 换成你的实际路径：
#   command=<python.exe 的完整路径> -X utf8 <sts-autobot\driver\driver.py 的完整路径>
#
# 转义后的真实写法示例（目录名随意，只是演示格式）：
#   command=C\:\\Pythons\\python.exe -X utf8 C\:\\bots\\sts-autobot\\driver\\driver.py

runAtGameStart=true
verbose=true
maxInitializationTimeout=30
