# 放到 %LOCALAPPDATA%\ModTheSpire\CommunicationMod\config.properties
# command 指向决策驱动；Windows 路径需转义：反斜杠写成两个，冒号前加反斜杠
# 示例（按你的实际位置替换 <...>）：
#   command=<python.exe 完整路径> -X utf8 <sts-autobot\driver\driver.py 的完整路径>
# 转义后的真实写法形如：
#   command=C\:\\Python311\\python.exe -X utf8 C\:\\tools\\sts-autobot\\driver\\driver.py
runAtGameStart=true
verbose=true
maxInitializationTimeout=30
